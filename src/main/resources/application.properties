spring.application.name=auth-service

# Runtime: DataSource JDBC desde secretos externos (TEC-INFRA-T001).
# DB_JDBC_URL debe incluir sslmode=verify-full y la CA del proyecto real.
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# JPA valida el esquema; Flyway lo modifica. Sin DDL automático ni open-in-view.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Runtime no migra: la migración usa el perfil 'migration' con identidad aparte.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
