spring.application.name=auth-service

# Firma de accesos (TEC-IDENTIDAD-T001). Sin estos valores la emisión se deniega.
identidad.issuer=${AUTH_ISSUER:}
identidad.clave-privada=${AUTH_CLAVE_PRIVADA:}
identidad.clave-privada-archivo=${AUTH_CLAVE_PRIVADA_ARCHIVO:}

# Errores de Spring MVC (404, 405, cuerpo ilegible...) en RFC 7807 y nunca como
# página HTML (TEC-IDENTIDAD-T002). Los errores del contrato llevan además su code.
spring.mvc.problemdetails.enabled=true
