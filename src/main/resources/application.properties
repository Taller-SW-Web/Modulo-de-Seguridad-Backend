spring.application.name=auth-service

# Despliegue (TEC-INFRA-T005): la plataforma inyecta PORT; detrás de su proxy TLS.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# CORS: orígenes exactos de la SPA, separados por comas (CorsConfig). Vacío = ninguno.
g7.cors.origenes=${G7_CORS_ORIGENES:}

# Actuator: solo /actuator/health público y sin detalles. Broker y correo llegan con
# TEC-INFRA-T004; mientras no existan no deben tumbar la salud del servicio.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=${G7_SALUD_BROKER:false}

# Eventos (TEC-INFRA-T004): publicar en RabbitMQ solo si hay broker (SPRING_RABBITMQ_* o _ADDRESSES).
g7.eventos.publicar=${G7_EVENTOS_PUBLICAR:false}
spring.rabbitmq.publisher-confirm-type=simple
management.health.mail.enabled=${G7_SALUD_CORREO:false}

# Firma de accesos (TEC-IDENTIDAD-T001). Sin estos valores la emisión se deniega.
identidad.issuer=${AUTH_ISSUER:}
identidad.clave-privada=${AUTH_CLAVE_PRIVADA:}
identidad.clave-privada-archivo=${AUTH_CLAVE_PRIVADA_ARCHIVO:}
# Rotación (RF-17.3): pública retirada que se sigue publicando y aceptando al menos 24 h.
identidad.clave-publica-anterior=${AUTH_CLAVE_PUBLICA_ANTERIOR:}

# Errores de Spring MVC (404, 405, cuerpo ilegible...) en RFC 7807 y nunca como
# página HTML (TEC-IDENTIDAD-T002). Los errores del contrato llevan además su code.
spring.mvc.problemdetails.enabled=true

# Carga opcional de .env local (formato properties). En nube solo variables de entorno.
spring.config.import=optional:file:.env[.properties]

# Runtime: DataSource JDBC desde secretos externos (TEC-INFRA-T001).
# DB_JDBC_URL debe incluir sslmode=verify-full y la CA del proyecto real.
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# JPA valida el esquema; Flyway lo modifica. Sin DDL automático ni open-in-view.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Runtime no migra: la migración usa el perfil 'migration' con identidad aparte.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
