<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu código para iniciar sesión</title>
</head>
<body style="margin:0;background:#F7F5F0;color:#1B1812;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#F7F5F0">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#FFFFFF"
             style="max-width:600px;border:1px solid #DEE2E6;border-top:4px solid #1B1812;border-radius:8px;">
        <tr><td style="padding:0 28px 28px;">
          <img src="{{logoUrl}}" width="148" height="111" alt="Inka Athletics" style="display:block;border:0;">
          <h1 style="margin:0 0 16px;font-size:28px;line-height:34px;">Tu código para iniciar sesión</h1>
          <p style="margin:0 0 18px;color:#495057;line-height:24px;">Escribe este código en la pantalla de inicio de sesión.</p>
          <p style="margin:0 0 18px;padding:16px;background:#FFF1E5;border-radius:6px;text-align:center;font-size:32px;font-weight:bold;letter-spacing:5px;">{{otp}}</p>
          <p style="margin:0 0 12px;color:#495057;line-height:24px;">El código es válido mientras tu desafío esté vigente. Si solicitaste otro, usa el más reciente.</p>
          <p style="margin:0;color:#495057;line-height:24px;">Si no intentaste iniciar sesión, puedes ignorar este correo. Mantén el código en privado.</p>
        </td></tr>
        <tr><td style="border-top:1px solid #DEE2E6;padding:16px 28px;font-size:13px;">Inka Athletics</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
