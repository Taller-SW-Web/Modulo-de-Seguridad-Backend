name: CI Backend

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  destino-pr:
    name: Backend - destino del PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir develop como origen de los PR hacia main
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          REPO_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENTO" = "pull_request" ] && [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ] || [ "$REPO_HEAD" != "$REPO" ]; then
              echo '::error::Los cambios llegan a main mediante un PR de develop de este repositorio.'
              exit 1
            fi
          fi

  build-test:
    name: Backend - build y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Gradle y validar el wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Comprobar Docker para Testcontainers
        run: docker info
      - name: Compilar, probar y empaquetar
        run: bash ./gradlew --no-daemon --console=plain clean build
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  imagen:
    name: Backend - imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-test]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construir la imagen de despliegue (TEC-INFRA-T005)
        run: docker build --pull -t g7-auth-service:ci .
      - name: Comprobar usuario sin privilegios, Java 21 y jar
        run: |
          test "$(docker run --rm --entrypoint id g7-auth-service:ci -un)" = "g7"
          docker run --rm --entrypoint java g7-auth-service:ci -version 2>&1 | grep -q 'version "21'
          docker run --rm --entrypoint sh g7-auth-service:ci -c 'test -s /app/app.jar'
      - name: Comprobar que la imagen no lleva secretos ni fuentes
        run: |
          if docker run --rm --entrypoint sh g7-auth-service:ci -c \
            'find / -xdev \( -name "*.pem" -o -name ".env" -o -name "*.key" -o -path "/fuente*" \) 2>/dev/null | grep -v "^/etc/ssl\|^/usr/share\|^/usr/lib/ssl\|^/proc"'; then
            echo '::error::La imagen contiene archivos privados o fuentes.'
            exit 1
          fi

  deploy:
    name: Backend - despliegue a Render
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [destino-pr, build-test, imagen, pruebas-script-deploy, pruebas-script-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Ejecutar render_deploy.py (despliega y verifica SHA)
        env:
          GITHUB_SHA: ${{ github.sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_HEALTH_URL: https://g7-auth-service.onrender.com/actuator/health
          RENDER_DEPLOY_TIMEOUT_SECONDS: 1800
          RENDER_HEALTH_TIMEOUT_SECONDS: 120
          RENDER_POLL_INTERVAL_SECONDS: 10
        run: python .github/scripts/render_deploy.py

  smoke-test:
    name: Backend - smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [deploy]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Ejecutar smoke_test.py (salud, JWKS, login real)
        env:
          SMOKE_BASE_URL: https://g7-auth-service.onrender.com
          SMOKE_LOGIN_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
          SMOKE_HEALTH_TIMEOUT_SECONDS: 120
          SMOKE_POLL_INTERVAL_SECONDS: 10
          SMOKE_REQUEST_TIMEOUT_SECONDS: 30
        run: python .github/scripts/smoke_test.py

  pruebas-script-deploy:
    name: Pruebas del script de despliegue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Ejecutar pruebas de render_deploy.py
        run: python .github/scripts/test_render_deploy.py

  pruebas-script-smoke:
    name: Pruebas del script de smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Ejecutar pruebas de smoke_test.py
        run: python .github/scripts/test_smoke_test.py

  e2e-playwright:
    name: E2E Playwright (FEAT-12-T4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [deploy, smoke-test, build-test, imagen, pruebas-script-deploy, pruebas-script-smoke]
    if: >-
      ${{ always() && needs.build-test.result == 'success' &&
          needs.imagen.result == 'success' &&
          needs.pruebas-script-deploy.result == 'success' &&
          needs.pruebas-script-smoke.result == 'success' &&
          vars.E2E_RENDER_HABILITADO == 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
          needs.deploy.result == 'success' && needs.smoke-test.result == 'success' }}
    env:
      E2E_BASE_URL: https://g7-seguridad-spa.onrender.com
      E2E_CUENTAS_CLAVE: ${{ secrets.E2E_CUENTAS_CLAVE }}
      E2E_CORREO_CLIENTE: ${{ secrets.E2E_CORREO_CLIENTE }}
      E2E_CORREO_ADMIN: ${{ secrets.E2E_CORREO_ADMIN }}
      E2E_CORREO_API: ${{ secrets.E2E_CORREO_API }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout frontend repo para E2E
        uses: actions/checkout@v6
        with:
          repository: Taller-SW-Web/G7-Modulo-de-Seguridad-Frontend
          ref: feat/EP-02-seguridad-e2e
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar configuración de la prueba
        shell: bash
        run: |
          for variable in E2E_CUENTAS_CLAVE E2E_CORREO_CLIENTE E2E_CORREO_ADMIN E2E_CORREO_API; do
            if [ -z "${!variable}" ]; then
              echo "::error::Falta configurar $variable para ejecutar la suite completa."
              exit 1
            fi
          done
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar Playwright y navegadores
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Ejecutar suite E2E contra despliegue
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_CUENTAS_CLAVE: ${{ env.E2E_CUENTAS_CLAVE }}
          E2E_CORREO_CLIENTE: ${{ env.E2E_CORREO_CLIENTE }}
          E2E_CORREO_ADMIN: ${{ env.E2E_CORREO_ADMIN }}
        run: npx playwright test
      - name: Subir reporte HTML de Playwright (siempre, incluso si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-FEAT-12-T4-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7
      - name: Confirmar resultados
        run: |
          if [ -d "frontend/playwright-report" ]; then
            echo "✅ Informe HTML generado en frontend/playwright-report/"
          else
            echo "❌ No se generó el informe"
            exit 1
          fi

  e2e-aislado:
    name: E2E Playwright en entorno aislado
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: temporal-ci
          POSTGRES_DB: g7_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d g7_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.32
        ports: ['1025:1025', '8025:8025']
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: temporal-ci
      PGDATABASE: g7_e2e
      DB_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/g7_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: temporal-ci
      SPRING_MAIL_HOST: 127.0.0.1
      SPRING_MAIL_PORT: '1025'
      G7_CORREO_REMITENTE: pruebas@fixtures.g7.test
      G7_CORS_ORIGENES: http://localhost:5173
      G7_FIXTURES_CUENTAS_HABILITADAS: 'true'
      G7_EVENTOS_PUBLICAR: 'false'
      AUTH_ISSUER: http://localhost:8080/api/v1/auth
      AUTH_OTP_HMAC_KEY_ID: ci
      AUTH_FALLOS_HMAC_KEY_ID: ci
      AUTH_OUTBOX_AES_KEY_ID: ci
      E2E_CORREO_API: http://127.0.0.1:8025
      G7_BACKEND_URL: http://127.0.0.1:8080
      E2E_CORREO_CLIENTE: cliente.a@fixtures.g7.test
      E2E_CORREO_ADMIN: admin@fixtures.g7.test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout de la suite frontend
        uses: actions/checkout@v6
        with:
          repository: Taller-SW-Web/G7-Modulo-de-Seguridad-Frontend
          ref: 227dbc97303a9289ecf68a8ee83dd1f569c7bd9f
          path: frontend
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inicializar la base temporal
        run: bash .github/scripts/e2e-init-db.sh
      - name: Preparar claves temporales y backend
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/ci-firma.pem" 2>/dev/null
          printf 'EjemploComun8!\n' > "$RUNNER_TEMP/ci-comunes.txt"
          clave="Ci$(openssl rand -hex 16)9!"
          echo "::add-mask::$clave"
          {
            echo "G7_FIXTURES_CUENTAS_CLAVE=$clave"
            echo "E2E_CUENTAS_CLAVE=$clave"
            echo "AUTH_CLAVE_PRIVADA_ARCHIVO=$RUNNER_TEMP/ci-firma.pem"
            echo "G7_PASSWORD_COMUNES_ARCHIVO=$RUNNER_TEMP/ci-comunes.txt"
            for variable in AUTH_OTP_HMAC_KEY AUTH_FALLOS_HMAC_KEY AUTH_OUTBOX_AES_KEY AUTH_SOLICITUD_LIMITADA_HMAC_KEY; do
              valor=$(openssl rand -base64 32)
              echo "::add-mask::$valor" >&2
              echo "$variable=$valor"
            done
          } >> "$GITHUB_ENV"
          bash ./gradlew --no-daemon bootJar -x test
      - name: Iniciar backend aislado
        run: |
          set -euo pipefail
          java -jar build/libs/*-SNAPSHOT.jar > "$RUNNER_TEMP/e2e-backend.log" 2>&1 &
          for intento in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo '::error::El backend de pruebas no arrancó.'
          tail -n 60 "$RUNNER_TEMP/e2e-backend.log"
          exit 1
      - name: Instalar y ejecutar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --workers=1
      - name: Guardar informe del entorno aislado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-aislado-${{ github.run_id }}
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
