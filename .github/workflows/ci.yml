name: CI Backend

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  destino-pr:
    name: Backend - destino del PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir develop como origen de los PR hacia main
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          REPO_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENTO" = "pull_request" ] && [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ] || [ "$REPO_HEAD" != "$REPO" ]; then
              echo '::error::Los cambios llegan a main mediante un PR de develop de este repositorio.'
              exit 1
            fi
          fi

  build-test:
    name: Backend - build y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Gradle y validar el wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Comprobar Docker para Testcontainers
        run: docker info
      - name: Compilar, probar y empaquetar
        run: bash ./gradlew --no-daemon --console=plain clean build
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  imagen:
    name: Backend - imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construir la imagen de despliegue (TEC-INFRA-T005)
        run: docker build --pull -t g7-auth-service:ci .
      - name: Comprobar usuario sin privilegios, Java 21 y jar
        run: |
          test "$(docker run --rm --entrypoint id g7-auth-service:ci -un)" = "g7"
          docker run --rm --entrypoint java g7-auth-service:ci -version 2>&1 | grep -q 'version "21'
          docker run --rm --entrypoint sh g7-auth-service:ci -c 'test -s /app/app.jar'
      - name: Comprobar que la imagen no lleva secretos ni fuentes
        run: |
          if docker run --rm --entrypoint sh g7-auth-service:ci -c \
            'find / -xdev \( -name "*.pem" -o -name ".env" -o -name "*.key" -o -path "/fuente*" \) 2>/dev/null | grep -v "^/etc/ssl\|^/usr/share\|^/usr/lib/ssl\|^/proc"'; then
            echo '::error::La imagen contiene archivos privados o fuentes.'
            exit 1
          fi

  deploy:
    name: Backend - deploy a Render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [destino-pr, build-test, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Disparar deploy en Render
        env:
          RENDER_DEPLOY_HOOK_ID: ${{ secrets.RENDER_DEPLOY_HOOK_ID }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_ID}" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_ID para el deploy en Render."
            exit 1
          fi
          echo "Disparando deploy en Render para el SHA ${GITHUB_SHA}..."
          curl --fail --show-error --silent --location --request POST \
            --output /dev/null \
            "https://api.render.com/deploy/${RENDER_DEPLOY_HOOK_ID}"

      - name: Esperar version nueva en Render
        run: |
          for intento in $(seq 1 60); do
            HTTP_CODE=$(curl --silent --output /tmp/g7-health.json --write-out '%{http_code}' \
              --max-time 10 \
              https://g7-auth-service.onrender.com/actuator/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              cat /tmp/g7-health.json
              exit 0
            fi
            echo "Esperando health de Render... intento ${intento}/60"
            sleep 10
          done
          echo "::error::Render no respondió en /actuator/health dentro de 600s."
          exit 1
