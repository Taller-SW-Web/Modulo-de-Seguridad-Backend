name: CI Backend

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  destino-pr:
    name: Backend - destino del PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir develop como origen de los PR hacia main
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          REPO_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENTO" = "pull_request" ] && [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ] || [ "$REPO_HEAD" != "$REPO" ]; then
              echo '::error::Los cambios llegan a main mediante un PR de develop de este repositorio.'
              exit 1
            fi
          fi

  build-test:
    name: Backend - build y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Gradle y validar el wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Comprobar Docker para Testcontainers
        run: docker info
      - name: Compilar, probar y empaquetar
        run: bash ./gradlew --no-daemon --console=plain clean build
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  imagen:
    name: Backend - imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-test]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construir la imagen de despliegue (TEC-INFRA-T005)
        run: docker build --pull -t g7-auth-service:ci .
      - name: Comprobar usuario sin privilegios, Java 21 y jar
        run: |
          test "$(docker run --rm --entrypoint id g7-auth-service:ci -un)" = "g7"
          docker run --rm --entrypoint java g7-auth-service:ci -version 2>&1 | grep -q 'version "21'
          docker run --rm --entrypoint sh g7-auth-service:ci -c 'test -s /app/app.jar'
      - name: Comprobar que la imagen no lleva secretos ni fuentes
        run: |
          if docker run --rm --entrypoint sh g7-auth-service:ci -c \
            'find / -xdev \( -name "*.pem" -o -name ".env" -o -name "*.key" -o -path "/fuente*" \\) 2>/dev/null | grep -v "^/etc/ssl\|^/usr/share\|^/usr/lib/ssl\|^/proc"'; then
            echo '::error::La imagen contiene archivos privados o fuentes.'
            exit 1
          fi

  deploy:
    name: Backend - despliegue a Render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-test, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Desplegar a Render y verificar SHA
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "Desplegando a Render con SHA: $GITHUB_SHA"
          response=$(curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Respuesta del deploy hook: $response"
          deploy_id=$(echo "$response" | jq -r '.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "::error::No se obtuvo deploy.id del hook de Render"
            exit 1
          fi
          echo "Deploy ID: $deploy_id"
          echo "Verificando despliegue en Render..."
          for i in $(seq 1 30); do
            status=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id" \
              | jq -r '.status // empty')
            echo "Estado del despliegue: $status"
            if [ "$status" = "live" ]; then
              commit_id=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id" \
                | jq -r '.commitId // empty')
              echo "Commit desplegado: $commit_id"
              if [ "$commit_id" = "$GITHUB_SHA" ]; then
                echo "✅ SHA desplegado coincide con GITHUB_SHA"
                break
              else
                echo "::warning::SHA desplegado ($commit_id) no coincide con GITHUB_SHA ($GITHUB_SHA)"
              fi
            elif [ "$status" = "failed" ] || [ "$status" = "canceled" ]; then
              echo "::error::Despliegue falló o cancelado: $status"
              exit 1
            fi
            sleep 20
          done

  smoke-test:
    name: Backend - smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [deploy]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verificar health endpoint
        run: |
          echo "Verificando /actuator/health en el despliegue de Render..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://g7-auth-service.onrender.com/actuator/health)
            if [ "$code" = "200" ]; then
              echo "✅ Health check OK"
              break
            fi
            echo "Esperando despliegue... intento $i"
            sleep 10
          done
      - name: Verificar JWKS
        run: |
          echo "Verificando /.well-known/openid-configuration..."
          for i in $(seq 1 10); do
            issuer=$(curl -s https://g7-auth-service.onrender.com/.well-known/openid-configuration 2>/dev/null | jq -r '.issuer // empty')
            if [ -n "$issuer" ]; then
              echo "✅ JWKS válido - issuer: $issuer"
              break
            fi
            echo "Esperando descubrimiento OIDC... intento $i"
            sleep 10
          done
      - name: Smoke test login real
        env:
          SMOKE_LOGIN_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
        run: |
          echo "Probando login real con cuenta de prueba..."
          response=$(curl -s -X POST https://g7-auth-service.onrender.com/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"correo\":\"$SMOKE_LOGIN_EMAIL\",\"contrasena\":\"$SMOKE_LOGIN_PASSWORD\"}")
          echo "Respuesta del login: $response"
          token=$(echo "$response" | jq -r '.accessToken // empty')
          if [ -n "$token" ]; then
            echo "✅ Login de smoke exitoso - token obtenido"
          else
            echo "::error::Login de smoke falló - no se obtuvo token"
            exit 1
          fi

  e2e-playwright:
    name: E2E Playwright (FEAT-12-T4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [deploy, smoke-test, build-test, imagen]
    env:
      # Apunta a la SPA desplegada en Render, no al backend API
      E2E_BASE_URL: https://g7-seguridad-spa.onrender.com
      # Credenciales de cuenta de prueba (solo por variable de entorno, nunca en Git)
      E2E_CUENTAS_CLAVE: ${{ secrets.E2E_CUENTAS_CLAVE }}
      # Correos para recibir OTP en CI
      E2E_CORREO_CLIENTE: ${{ secrets.E2E_CORREO_CLIENTE }}
      E2E_CORREO_ADMIN: ${{ secrets.E2E_CORREO_ADMIN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Checkout del frontend repo para ejecutar la suite Playwright
      - name: Checkout frontend repo para E2E
        uses: actions/checkout@v6
        with:
          repository: Taller-SW-Web/G7-Modulo-de-Seguridad-Frontend
          ref: feat/EP-02-seguridad-e2e
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar Playwright y navegadores
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Ejecutar suite E2E contra despliegue
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_CUENTAS_CLAVE: ${{ env.E2E_CUENTAS_CLAVE }}
          E2E_CORREO_CLIENTE: ${{ env.E2E_CORREO_CLIENTE }}
          E2E_CORREO_ADMIN: ${{ env.E2E_CORREO_ADMIN }}
        run: npx playwright test
      - name: Subir reporte HTML de Playwright (siempre, incluso si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-FEAT-12-T4-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7
      - name: Confirmar resultados
        run: |
          if [ -d "frontend/playwright-report" ]; then
            echo "✅ Informe HTML generado en frontend/playwright-report/"
          else
            echo "❌ No se generó el informe"
            exit 1
          fi
