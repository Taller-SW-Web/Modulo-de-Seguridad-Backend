name: Seguridad Backend

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: seguridad-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Dependencias / Gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generar y enviar el grafo de dependencias
        uses: gradle/actions/dependency-submission@v6
        with:
          cache-disabled: true
          dependency-graph: generate-and-submit

  dependency-review:
    name: Dependencias / revisión del PR
    if: github.event_name == 'pull_request'
    needs: [dependency-submission]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Revisar dependencias añadidas o actualizadas
        uses: actions/dependency-review-action@v5
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
          warn-only: true
          license-check: false
          show-patched-versions: true
          show-openssf-scorecard: false

  codeql-java:
    name: CodeQL / Java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compilar clases de producción para el análisis
        run: bash ./gradlew --no-daemon --console=plain classes

      - name: Analizar Java
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          output: ${{ runner.temp }}/codeql-results

      - name: Conservar el reporte SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: warn
          retention-days: 7
