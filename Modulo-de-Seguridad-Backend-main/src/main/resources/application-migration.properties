# Perfil 'migration': ejecuta Flyway como paso controlado con identidad migradora
# separada del runtime (TEC-INFRA-T002). Activar con:
#   SPRING_PROFILES_ACTIVE=migration ./gradlew bootRun --args='--spring.profiles.active=migration'
# o con el jar: java -jar app.jar --spring.profiles.active=migration
# No usar baseline automático, repair, reset ni DROP. Revisar historial antes de aplicar.
# En la ventana T002 se usa el Flyway CLI (runbook VENTANA-T002); este perfil es la
# alternativa equivalente y aplica las mismas ubicaciones.

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
# Versionadas (V101+) y el catálogo repetible de autorización (R__, se aplica tras las versionadas).
spring.flyway.locations=classpath:db/migration,classpath:db/autorizacion

# Paso de migración, no servidor: sin web para no dejar la app levantada con la identidad migradora.
spring.main.web-application-type=none

spring.datasource.url=${DB_MIGRATION_JDBC_URL}
spring.datasource.username=${DB_MIGRATION_USERNAME}
spring.datasource.password=${DB_MIGRATION_PASSWORD}

# Sin inicialización de esquema por JPA también en migración.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
